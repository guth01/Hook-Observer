apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: hook-observer-worker:latest
          imagePullPolicy: Never # Use local image
          ports:
            - containerPort: 9091 # Prometheus metrics
          env:
            - name: DATABASE_URL
              value: "postgres://user:password@postgres:5432/hookdb?sslmode=disable"
            - name: KAFKA_BROKER
              value: "kafka:9092"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "jaeger:4317"
---
apiVersion: v1
kind: Service
metadata:
  name: worker
spec:
  selector:
    app: worker
  ports:
    - name: metrics
      port: 9091
      targetPort: 9091
